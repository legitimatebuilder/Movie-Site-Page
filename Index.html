<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flick Fusion</title>
    <link rel="stylesheet" href="./CSS/Styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
        integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="container header">
        <img src="./CSS/Images/logo.png" class="logo">
        <a href="#" class="header-btn"><i class="fa fa-user"></i>Account</a>
    </div>

    <div class="container movie-details">
        <div class="row">
            <div class="col-md-6 left-box">
                <h1>X-Men 2.0</h1>
                <p>Subscribe Flick Fusion Youtube Channel to watch more videos. <br>Press the bell icon to get immediate
                    notification of new video.</p>
                <p>Cast:</p>
                <div class="casting">
                    <img src="./CSS/Images/hugh-jackman.jpg" title="Hugh Jackman">
                    <img src="./CSS/Images/james-marsden.jpg" title="James Marsden">
                    <img src="./CSS/Images/famike-jansen.jpg" title="Famike Jansen">
                    <img src="./CSS/Images/patric-stewart.jpg" title="Patric Stewart">
                    <img src="./CSS/Images/ana-paquin.jpeg" title="Ana Paquin">
                </div>
                <a href="#"><i class="fa fa-play"></i>Watch Now</a>
                <a href="#" class="download-btn"><i class="fa fa-arrow-down"></i>Download</a>
            </div>

            <div class="col-md-6 text-center">
                <img src="./CSS/Images/x-men-2.jpg" class="movie-img">
            </div>

        </div>
    </div>
    <div class="container series">
        <h3>Popular Movies</h3>
        <div class="row">
            <div class="col-md-4">
                <div class="row">
                    <div class="col-6"><img src="./CSS/Images/titanic.jpg"></div>
                    <div class="col-6"><img src="./CSS/Images/terminator-2.jpeg"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="row">
                    <div class="col-6"><img src="./CSS/Images/her.jpg"></div>
                    <div class="col-6"><img src="./CSS/Images/scream-2.jpeg"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="row">
                    <div class="col-6"><img src="./CSS/Images/dunkirk.jpg"></div>
                    <div class="col-6"><img src="./CSS/Images/30-days-of-night.jpg"></div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
